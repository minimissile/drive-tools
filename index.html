<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/brand/panxu-mark.svg"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: panxu-media:; media-src 'self' blob: panxu-media:; connect-src 'self' ws://127.0.0.1:8070; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="stylesheet" href="/src/startup/startup.css" />
    <title>盘序 · 内容营销工作台</title>
  </head>
  <body>
    <div id="root">
      <div class="startup-screen">
        <div class="startup-brand">
          <img
            src="/src/assets/brand/panxu-mark.svg"
            width="40"
            height="40"
            alt=""
          /><span>盘序<small>PANXU STUDIO</small></span>
        </div>
        <main class="startup-content">
          <img
            class="startup-art"
            src="/src/startup/startup-art.svg"
            width="560"
            height="400"
            alt=""
          />
          <h1>让每份资源，产生内容。</h1>
          <p class="startup-description">从整理到创作，你的工作从这里接续。</p>
          <p class="startup-status" role="status">正在启动盘序…</p>
        </main>
        <footer class="startup-footer">
          本地优先 · 资源与内容在此有序连接
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
